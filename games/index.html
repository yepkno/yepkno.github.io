<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏资源 · 叶の个人数据库</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* ===== 游戏资源 · 独立主页 =====
   与主站同仓不同页（同源），有自己的游戏向视觉语言：
   深墨底 + 青绿/靛紫霓虹点缀，克制地传达「游戏库」气质，不与主站朱红科技风混淆。
   零依赖、无构建、无后端。 */
:root{
  --bg:#07090f;
  --panel:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.10);
  --text:#e8ecf5;
  --muted:#9aa5bb;
  --faint:#5d6780;
  --accent:#3ee6c4;        /* 游戏青绿 */
  --accent-2:#7c6cff;      /* 靛紫 */
  --on-accent:#04120d;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%,rgba(62,230,196,.10),transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 10%,rgba(124,108,255,.10),transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}

/* ===== 密码门 ===== */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);overflow:hidden}
.gate[hidden]{display:none}
.gate::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 50% 40% at 50% 45%,rgba(62,230,196,.14),transparent 65%),
    radial-gradient(ellipse 40% 30% at 20% 20%,rgba(124,108,255,.12),transparent 60%),
    radial-gradient(ellipse 40% 30% at 80% 80%,rgba(62,230,196,.08),transparent 60%)}
.gstage{position:relative;z-index:2;text-align:center;padding:24px;max-width:min(640px,92vw)}
.geyebrow{font-size:12px;font-weight:600;letter-spacing:.44em;text-indent:.44em;
  color:var(--accent);margin-bottom:18px;font-family:ui-monospace,Consolas,monospace}
.gtitle{font-size:clamp(30px,5.8vw,56px);font-weight:700;line-height:1.24;letter-spacing:.02em;
  color:#f4f7ff;margin:0;text-shadow:0 1px 2px rgba(0,0,0,.6),0 3px 24px rgba(62,230,196,.25)}
.gsub{margin:16px 0 0;font-size:14px;letter-spacing:.04em;color:var(--muted)}
.gfield{margin-top:34px;position:relative;display:flex;align-items:center;justify-content:center}
.gfield input{width:min(340px,74vw);padding:10px 34px 12px;border:0;background:transparent;outline:none;
  color:#fff;font-size:clamp(17px,2.4vw,22px);text-align:center;letter-spacing:.3em;
  caret-color:var(--accent)}
.gfield input::placeholder{color:rgba(255,255,255,.45);letter-spacing:.32em;font-size:.84em}
.gfield::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(340px,74vw);height:1px;
  background:linear-gradient(90deg,transparent,var(--accent) 24%,var(--accent-2) 50%,var(--accent) 76%,transparent);
  transition:height .2s}
.gfield:focus-within::after{height:2px}
.gok{position:absolute;right:calc(50% - 170px - 34px);bottom:2px;width:34px;height:34px;padding:0;border:0;
  background:transparent;color:var(--muted);font-size:15px;cursor:pointer;transition:.18s}
.gok:hover{color:#fff}
.err{color:#ff8a8a;font-size:13.5px;min-height:18px;margin-top:16px}
.genter{margin-top:0;display:inline-flex;padding:3px;border:0;cursor:pointer;background:transparent;
  border-radius:calc(var(--r) + 3px)}
.genter[hidden]{display:none}
.genter::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(100deg,var(--accent),var(--accent-2))}
.genter .genter-in{position:relative;display:block;padding:12px 40px;border-radius:var(--r);
  background:#05070a;color:#fff;font-size:15.5px;font-weight:600;letter-spacing:.06em}
.gate.wrong .gfield{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

/* ===== 首页 ===== */
.app{max-width:1180px;margin:0 auto;padding:0 24px 60px}
.topbar{display:flex;align-items:center;gap:16px;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand i{font-style:normal;font-family:ui-monospace,Consolas,monospace;font-size:14px;
  letter-spacing:.16em;color:var(--accent);font-weight:600}
.brand b{font-weight:400;color:var(--faint);margin:0 4px}
.brand span{font-size:16px;font-weight:600;letter-spacing:.04em}
.spacer{flex:1}
.exit{padding:8px 18px;font-size:13px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-family:inherit;transition:.2s}
.exit:hover{color:#fff;border-color:var(--accent)}

/* 筛选栏 */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
.chip{padding:7px 16px;font-size:13px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;cursor:pointer;font-family:inherit;transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent);font-weight:600}

/* 封面墙 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;margin-top:20px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(62,230,196,.15)}
.card .ph{aspect-ratio:16/9;overflow:hidden;background:#0c1118}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{padding:13px 15px 15px}
.card .t{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:6px}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.card .tag{font-size:11px;color:var(--accent);font-family:ui-monospace,Consolas,monospace}

/* 空状态 */
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty .ic{font-size:44px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:18px;margin:0 0 8px;color:var(--text)}
.empty p{font-size:14px;line-height:1.8;margin:0}

/* 详情下载面板 */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,10,.72);backdrop-filter:blur(4px);padding:24px}
.modal[hidden]{display:none}
.modal-card{width:min(720px,92vw);max-height:86vh;overflow:auto;background:#0b0f17;
  border:1px solid var(--line);border-radius:16px;padding:26px 28px}
.modal-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.modal-head h2{flex:1;font-size:20px;margin:0;line-height:1.4}
.mclose{padding:6px 12px;font-size:13px;color:var(--muted);background:transparent;
  border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:inherit}
.mclose:hover{color:#fff}
.modal-body{font-size:14px;line-height:1.85;color:var(--muted)}
.dl{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.dl p{font-size:13px;color:var(--faint);margin:0 0 12px}
.dl .warn{color:#ffb86b;font-weight:600}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);line-height:1.8}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}

@media (max-width:600px){
  .wall{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app{padding:0 14px 40px}
  .topbar{flex-wrap:wrap}
  .brand span{font-size:14px}
}
</style>
</head>
<body>

<!-- 密码门 -->
<div class="gate" id="gate" hidden>
  <div class="gstage">
    <div class="geyebrow">GAME VAULT</div>
    <h2 class="gtitle">请输入访问密码</h2>
    <p class="gsub">游戏资源栏目受密码保护 · 该密码仅对本栏目有效</p>
    <div class="gfield" id="gateField">
      <input type="password" id="gatePwd" placeholder="密码" autocomplete="off"
             aria-label="游戏资源栏目密码" enterkeyhint="go" spellcheck="false">
      <button type="button" class="gok" id="gateOk" aria-label="确认密码">&#8629;</button>
    </div>
    <div class="genter" id="gateEnter" hidden><span class="genter-in">进入游戏库</span></div>
    <div class="err" id="gateErr" role="status" aria-live="polite"></div>
  </div>
</div>

<!-- 首页 -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand"><i>GAME-DB</i><b>//</b><span>游戏资源</span></div>
    <div class="spacer"></div>
    <button class="exit" id="exitBtn" type="button">返回主站</button>
  </header>

  <div class="filters" id="filters"></div>

  <div class="wall" id="wall"></div>

  <footer>
    本站<strong>不制作、不修改、不存储</strong>任何软件文件，游戏资源均以第三方网盘分享链接提供；
    内容收集自互联网，仅供个人学习交流使用，请于下载后 24 小时内删除。
    <a href="../legal.html#disclaimer">免责声明</a> · <a href="../legal.html#complaint">侵权投诉指引</a>
  </footer>
</div>

<!-- 详情下载面板 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="mTitle"></h2>
      <button class="mclose" id="mClose" type="button">关闭</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
// ===== SHA-256（纯前端，与主站 app.js 同源实现）=====
function sha256(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = "length";
  var i, j, result = "", words = [];
  var asciiBitLength = ascii[lengthProperty] * 8;
  var hash = (sha256.h = sha256.h || []);
  var k = (sha256.k = sha256.k || []);
  var primeCounter = k[lengthProperty];
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += "\x80";
  while ((ascii[lengthProperty] % 64) - 56) ascii += "\x00";
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return "";
    words[i >> 2] |= j << (((3 - i) % 4) * 8);
  }
  words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
  words[words[lengthProperty]] = asciiBitLength;
  for (j = 0; j < words[lengthProperty]; ) {
    var w = words.slice(j, (j += 16));
    var oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7] +
        (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
        ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] +
          (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
          w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
        ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0, hash[0], hash[1], hash[2],
              (hash[3] + temp1) | 0, hash[4], hash[5], hash[6]];
    }
    for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? "0" : "") + b.toString(16);
    }
  }
  return result;
}

// 游戏资源栏目口令的 SHA-256（与主站 WALL_HASHES["游戏资源"] 一致）
var GAME_WALL_HASH = "3f1f29444c093e2890d2163174cce5d5db40386b84168e015ec9da46cff1a6f9";

function isUnlocked() {
  return sessionStorage.getItem("eo_docwall::游戏资源") === "1";
}
function setUnlocked() {
  sessionStorage.setItem("eo_docwall::游戏资源", "1");
}

// ===== 游戏资源数据（当前 0 篇，占位；等内容上传后再填充）=====
// 字段：{ title, cover, tags:[], summary, downloads:[{label, note}] }
// 封面建议 16:9；下载区一律「不在站内展示提取码，向站长获取」。
var GAMES = [];

// ===== 渲染 =====
var activeTag = null;

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function allTags() {
  var m = {};
  GAMES.forEach(function (g) { (g.tags || []).forEach(function (t) { m[t] = 1; }); });
  return Object.keys(m);
}

function renderFilters() {
  var box = document.getElementById("filters");
  box.innerHTML = "";
  var tags = allTags();
  if (!tags.length) { box.innerHTML = ""; return; }
  var all = document.createElement("button");
  all.type = "button";
  all.className = "chip" + (activeTag === null ? " on" : "");
  all.textContent = "全部 (" + GAMES.length + ")";
  all.addEventListener("click", function () { activeTag = null; renderFilters(); renderWall(); });
  box.appendChild(all);
  tags.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (activeTag === t ? " on" : "");
    b.textContent = t;
    b.addEventListener("click", function () {
      activeTag = (activeTag === t) ? null : t;
      renderFilters(); renderWall();
    });
    box.appendChild(b);
  });
}

function renderWall() {
  var wall = document.getElementById("wall");
  wall.innerHTML = "";
  var list = GAMES.filter(function (g) {
    if (!activeTag) return true;
    return (g.tags || []).indexOf(activeTag) >= 0;
  });
  if (!list.length) {
    wall.innerHTML =
      '<div class="empty">' +
        '<div class="ic">🎮</div>' +
        '<h3>游戏资源库已就绪</h3>' +
        '<p>这里将陈列游戏的封面墙，支持按标签筛选、点击查看详情与下载。</p>' +
        '<p>资源正在整理中，敬请期待。</p>' +
      '</div>';
    return;
  }
  list.forEach(function (g) {
    var c = document.createElement("div");
    c.className = "card";
    c.tabIndex = 0;
    c.setAttribute("role", "button");
    c.setAttribute("aria-label", "打开：" + g.title);
    c.innerHTML =
      '<div class="ph"><img src="' + escapeHtml(g.cover || "") + '" alt="" loading="lazy" decoding="async"></div>' +
      '<div class="cap"><div class="t">' + escapeHtml(g.title) + '</div>' +
      '<div class="meta">' + (g.tags || []).map(function (t) {
        return '<span class="tag">#' + escapeHtml(t) + '</span>'; }).join('') + '</div></div>';
    c.addEventListener("click", function () { openModal(g); });
    c.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(g); }
    });
    wall.appendChild(c);
  });
}

function openModal(g) {
  document.getElementById("mTitle").textContent = g.title;
  var body = document.getElementById("mBody");
  var html = '<p>' + escapeHtml(g.summary || "") + '</p>';
  if (g.downloads && g.downloads.length) {
    html += '<div class="dl">';
    g.downloads.forEach(function (d) {
      html += '<p><strong>' + escapeHtml(d.label || "下载") + '</strong>' +
              (d.note ? ' · ' + escapeHtml(d.note) : '') + '</p>';
    });
    html += '<p><span class="warn">提取码不在站内展示</span>，请向站长获取（微信：Y18725560542）。</p>';
    html += '</div>';
  }
  body.innerHTML = html;
  document.getElementById("modal").hidden = false;
}

// ===== 密码门交互 =====
function showGate() {
  var g = document.getElementById("gate");
  var app = document.getElementById("app");
  app.hidden = true;
  g.hidden = false;
  var inp = document.getElementById("gatePwd");
  var err = document.getElementById("gateErr");
  var enter = document.getElementById("gateEnter");
  if (inp) inp.value = "";
  if (err) err.textContent = "";
  if (enter) enter.hidden = true;
  setTimeout(function () { if (inp) inp.focus(); }, 120);
}

function tryUnlock() {
  var inp = document.getElementById("gatePwd");
  var err = document.getElementById("gateErr");
  var g = document.getElementById("gate");
  var pwd = inp ? inp.value.trim() : "";
  pwd = pwd.replace(/[\uFF01-\uFF5E]/g, function (ch) {
    return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
  });
  if (!pwd) {
    if (err) err.textContent = "请输入密码";
    shake();
    return;
  }
  if (sha256(pwd) === GAME_WALL_HASH) {
    setUnlocked();
    if (err) err.textContent = "";
    var enter = document.getElementById("gateEnter");
    if (enter) enter.hidden = false;
    if (enter) setTimeout(function () { enter.focus(); }, 80);
    return;
  }
  if (err) err.textContent = "密码错误，请重试";
  if (inp) { inp.value = ""; inp.focus(); }
  shake();
}

function shake() {
  var g = document.getElementById("gate");
  g.classList.remove("wrong");
  void g.offsetWidth;
  g.classList.add("wrong");
  setTimeout(function () { g.classList.remove("wrong"); }, 460);
}

function enterApp() {
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  renderFilters();
  renderWall();
  window.scrollTo(0, 0);
}

// ===== 初始化 =====
(function init() {
  var gateOk = document.getElementById("gateOk");
  var gatePwd = document.getElementById("gatePwd");
  var gateEnter = document.getElementById("gateEnter");
  var exitBtn = document.getElementById("exitBtn");
  var mClose = document.getElementById("mClose");
  var modal = document.getElementById("modal");

  gateOk.addEventListener("click", tryUnlock);
  gatePwd.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  gateEnter.addEventListener("click", enterApp);

  exitBtn.addEventListener("click", function () { window.location.href = "../index.html"; });
  mClose.addEventListener("click", function () { modal.hidden = true; });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.hidden = true; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (!modal.hidden) { modal.hidden = true; return; }
    }
  });

  // 进站判断：已解锁（本会话）直接进首页，否则弹密码门
  if (isUnlocked()) { enterApp(); } else { showGate(); }
})();
</script>
</body>
</html>
